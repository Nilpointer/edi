[package]
name = "edi"
version = "0.1.3"
edition = "2024"
description = "A fast Sublime-style text editor"
license = "MIT"
repository = "https://github.com/Nilpointer/edi"

[dependencies]
eframe = "0.37.0"
ignore = "0.4.33"
ropey = "1.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
