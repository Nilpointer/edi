name: Release

# Push a tag like v0.1.0 to build every platform and publish a GitHub release.
# Running it by hand builds the packages as workflow artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_VERSION: 1.96.0
  CARGO_TERM_COLOR: always

jobs:
  appimage:
    name: Linux (AppImage + tarball)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build AppImage
        run: ./packaging/build-appimage.sh
      - name: Package tarball
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist "edi-$V-linux-x86_64"
          cp target/glibc2.35/release/edi README.md LICENSE "edi-$V-linux-x86_64/"
          tar czf "dist/edi-$V-linux-x86_64.tar.gz" "edi-$V-linux-x86_64"
          cp target/appimage/Edi-*-x86_64.AppImage dist/
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*

  flatpak:
    name: Linux (Flatpak)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build bundle
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          flatpak-builder --user --install-deps-from=flathub --repo=repo --force-clean \
            build packaging/flatpak/io.github.Nilpointer.Edi.yml
          mkdir -p dist
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "dist/Edi-$V-x86_64.flatpak" io.github.Nilpointer.Edi
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: dist/*

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Bundle Edi.app and DMG
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          APP=dist/dmg/Edi.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/edi" \
            target/aarch64-apple-darwin/release/edi target/x86_64-apple-darwin/release/edi
          sed "s/@VERSION@/$V/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          ICONSET=edi.iconset
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            cp "assets/icons/edi-$s.png" "$ICONSET/icon_${s}x${s}.png"
          done
          cp assets/icons/edi-32.png   "$ICONSET/icon_16x16@2x.png"
          cp assets/icons/edi-64.png   "$ICONSET/icon_32x32@2x.png"
          cp assets/icons/edi-256.png  "$ICONSET/icon_128x128@2x.png"
          cp assets/icons/edi-512.png  "$ICONSET/icon_256x256@2x.png"
          cp assets/icons/edi-1024.png "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/edi.icns"
          # Ad-hoc signature; the app is not notarized.
          codesign --force --deep --sign - "$APP"
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname Edi -srcfolder dist/dmg -ov -format UDZO "dist/Edi-$V-macos-universal.dmg"
          (cd dist/dmg && ditto -c -k --keepParent Edi.app "../Edi-$V-macos-universal.zip")
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.zip

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force dist, "edi-$v-windows-x86_64" | Out-Null
          Copy-Item target/release/edi.exe, README.md, LICENSE "edi-$v-windows-x86_64/"
          Compress-Archive -Path "edi-$v-windows-x86_64" -DestinationPath "dist/edi-$v-windows-x86_64.zip"
          Copy-Item target/release/edi.exe "dist/edi-$v-windows-x86_64.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [appimage, flatpak, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Edi ${GITHUB_REF_NAME#v}" \
            --generate-notes
